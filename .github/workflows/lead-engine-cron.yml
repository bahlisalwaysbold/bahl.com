name: Bahl Lead Engine Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  response-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Process due lead response reminders
        env:
          CRON_SECRET: ${{ secrets.LEAD_ENGINE_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://bahl.com.ng/api/lead-engine/cron"
